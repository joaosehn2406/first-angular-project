<app-header/>

<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user
          [user]="user"
          (userSelected)="onUserSelected($event)"
        />
      </li>
    }
  </ul>

  @if (selectedUser) {
    <app-tasks [userName]="selectedUser.name" [userTasks]="getAllUserTasks"/>
  } @else {
    <p id="fallback">Select a user to see it's tasks!</p>
  }
</main>
