@if (canShowModal) {
  <app-modal (closeModal)="onClickManageModal()" (addTask)="onAddTask($event)" />
}

<section id="tasks">
  <header>
    <h2>{{ userName }}'s Tasks</h2>
    <menu>
      <button (click)="onClickManageModal()">Add task</button>
    </menu>
  </header>

  <ul id="tasks-list">
    @for (task of userTasks; track task.id) {
      <li>
        <app-task [userTasks]="task" (complete)="onCompleteTask($event)" (removeTask)="onRemoveTask($event)"/>
      </li>
    }
  </ul>
</section>
