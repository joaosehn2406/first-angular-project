<section id="tasks">
  <header>
    <h2>{{ userName }}'s TasksComponent</h2>
    <menu>
      <button>Add task</button>
    </menu>
  </header>

  <ul id="tasks-list">
    @for (task of userTasks; track task.id) {
      <li>
        <app-task [userTasks]="task" (complete)="onCompleteTask($event)"/>
      </li>
    }
  </ul>
</section>
