@if (canShowRemoveDialog) {
  <app-remove-task (onDismissModal)="onClickManageModel()" (onConfirmModal)="onRemoveTask()"/>
}

<app-card>
  <article>
    <h2>{{ userTasks.title }}</h2>
    <time>{{ userTasks.dueDate }}</time>
    <p>{{ userTasks.summary }}</p>
    <p class="actions">
      <button class="remove" (click)="onClickManageModel()">Remove</button>
      <button (click)="onCompleteTask()">Complete</button>
    </p>
  </article>
</app-card>
